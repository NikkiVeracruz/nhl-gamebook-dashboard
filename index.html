<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NHL Gamebook Center</title><style>:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark;background:#0d1422;color:#f4f7fb}body{margin:0}main{max-width:1040px;margin:auto;padding:30px 20px}h1{font-size:2rem;margin:0}h2{font-size:1.15rem}.muted{color:#a7b6cc}header{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}.pill{border:1px solid #475569;border-radius:24px;padding:8px 12px;font-size:.83rem}.day{margin:28px 0 12px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}.game{border:1px solid #35445a;background:#182438;border-radius:14px;padding:18px}.game p{margin:9px 0}.button{display:inline-block;border-radius:9px;background:#d9eaff;color:#102035;text-decoration:none;font-weight:700;padding:10px 12px;margin:7px 7px 0 0}.waiting{color:#cbd5e1;font-size:.9rem}.notice{padding:12px 0;color:#d4dfed}footer{margin-top:35px;color:#a7b6cc;font-size:.85rem}a:focus-visible{outline:3px solid #8cb8ff;outline-offset:3px}</style></head><body><main><header><div><h1>NHL Gamebook Center</h1><p class="muted">Official NHL Game Summary &amp; Event Summary reports</p></div><span id="updated" class="pill">Awaiting first update</span></header><p id="window" class="muted"></p><div id="games" aria-live="polite"><p class="notice">Loading NHL games…</p></div><footer>Unofficial resource. Links open official NHL-hosted HTML reports. The reporting day changes at 3:00 AM Eastern.</footer></main><script>
const root=document.getElementById('games');function node(tag,cls,text){const x=document.createElement(tag);if(cls)x.className=cls;if(text!==undefined)x.textContent=text;return x}async function load(){try{const r=await fetch('./gamebooks.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('Could not load');const d=await r.json();document.getElementById('updated').textContent=d.updated_at?'Updated '+new Date(d.updated_at).toLocaleString():'Awaiting first update';document.getElementById('window').textContent=d.window_label||'';root.replaceChildren();if(d.warning)root.append(node('p','notice',d.warning));const games=Array.isArray(d.games)?d.games:[];if(!games.length){root.append(node('p','notice','No games listed yet. The first monitoring run may still be pending.'));return}const groups=new Map();for(const g of games){if(!groups.has(g.date))groups.set(g.date,[]);groups.get(g.date).push(g)}for(const [date,items] of groups){root.append(node('h2','day',new Date(date+'T12:00:00Z').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',timeZone:'UTC'})));const cards=node('section','cards');for(const g of items){const card=node('article','game');card.append(node('h2','',g.label||'NHL game'));if(g.status)card.append(node('p','muted',g.status));let count=0;for(const [key,label] of [['gs_url','Game Summary'],['es_url','Event Summary']]){if(g[key]&&/^https:\/\/www\.nhl\.com\/scores\/htmlreports\//i.test(g[key])){const a=node('a','button',label);a.href=g[key];a.target='_blank';a.rel='noopener noreferrer';card.append(a);count++}}if(!count)card.append(node('p','waiting','Awaiting official reports'));cards.append(card)}root.append(cards)}}catch(e){root.replaceChildren(node('p','notice','Dashboard data is unavailable. Please try again shortly.'))}}load();setInterval(load,300000);
</script></body></html>
