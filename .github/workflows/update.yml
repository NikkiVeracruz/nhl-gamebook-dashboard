name: Update NHL Gamebook Dashboard
on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
      timezone: "America/New_York"
permissions:
  contents: write
  actions: write
concurrency:
  group: nhl-gamebooks
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Check league calendar and overdue-report demand
        id: demand
        run: |
          if python adaptive_monitor.py guard NHL; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            code=$?
            if [ "$code" -ne 3 ]; then exit "$code"; fi
            echo "active=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Pause five-minute NHL schedule on idle days
        if: steps.demand.outputs.active == 'false' && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/update.yml/disable"
      - if: steps.demand.outputs.active == 'true'
        run: pip install -r requirements.txt
      - name: Check official NHL reports
        if: steps.demand.outputs.active == 'true'
        run: python monitor.py
      - name: Update historical archive
        if: steps.demand.outputs.active == 'true'
        run: python archive.py
      - name: Recover reports that rolled out of the current game window
        if: steps.demand.outputs.active == 'true'
        run: python recover_reports.py NHL recent
      - name: Record recent successful monitoring activity
        if: steps.demand.outputs.active == 'true'
        run: python adaptive_monitor.py heartbeat NHL
      - name: Block any loss of previously archived games or report links
        if: steps.demand.outputs.active == 'true'
        run: python tests/archive_integrity_gate.py archive.json
      - name: Publish report availability
        if: steps.demand.outputs.active == 'true'
        run: |
          if [[ -n "$(git status --porcelain gamebooks.json archive.json poll-status.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add gamebooks.json archive.json poll-status.json
            git commit -m "Update NHL reports for today and yesterday"
            for attempt in 1 2 3 4; do
              if git push; then exit 0; fi
              echo "Remote changed; rebasing and retrying push ($attempt)"
              git pull --rebase -X theirs origin main
              # Re-check against the freshly fetched remote after conflict resolution.
              python tests/archive_integrity_gate.py archive.json --baseline-ref FETCH_HEAD
              sleep 2
            done
            echo "Could not publish after retries" >&2
            exit 1
          fi
      - name: Disable five-minute NHL checks after the last missing report is found
        if: steps.demand.outputs.active == 'true' && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if python adaptive_monitor.py guard NHL; then
            echo "Continue NHL monitoring while a game or missing report needs attention"
          else
            code=$?
            if [ "$code" -ne 3 ]; then exit "$code"; fi
            gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/update.yml/disable"
            echo "Disabled idle NHL workflow"
          fi
