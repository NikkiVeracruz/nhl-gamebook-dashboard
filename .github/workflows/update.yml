name: Update NHL Gamebook Dashboard
on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
permissions:
  contents: write
concurrency:
  group: nhl-gamebooks
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check official NHL reports
        run: python monitor.py
      - name: Update historical archive
        run: python archive.py
      - name: Publish report availability
        run: |
          if [[ -n "$(git status --porcelain gamebooks.json archive.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add gamebooks.json archive.json
            git commit -m "Update NHL reports for today and yesterday"
            for attempt in 1 2 3 4; do
              if git push; then exit 0; fi
              echo "Remote changed; rebasing and retrying push ($attempt)"
              git pull --rebase -X theirs origin main
              sleep 2
            done
            echo "Could not publish after retries" >&2
            exit 1
          fi
