name: 2026 source and report accuracy safety rehearsal
on:
  push:
    branches: [staging-data-coverage-2026-11-23]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyyaml
      - name: Check Python and GitHub workflow YAML
        run: |
          python -m compileall -q .
          python - <<'PY'
          from pathlib import Path
          import yaml
          for path in Path(".github/workflows").glob("*.yml"):
              with path.open() as file: assert yaml.safe_load(file), str(path)
          print("Workflow syntax parsed")
          PY
      - name: Test repaired sources, official links, and archive protection
        run: |
          python -m unittest discover -s tests -p 'test_nhl_competition.py' -v
          python -m unittest discover -s tests -p 'test_adaptive_monitor.py' -v
          python -m unittest discover -s tests -p 'test_archive_safety.py' -v
      - name: Assert no existing archive or progress was modified
        run: git diff --exit-code -- archive.json gamebooks.json archive-progress.json
