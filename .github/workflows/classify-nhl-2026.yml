name: Reconcile 2026 NHL competition types and official reports
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/classify-nhl-2026.yml
      - competition_policy.py
permissions:
  contents: write
concurrency:
  group: nhl-gamebooks
  cancel-in-progress: false
jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Verify international and preseason reporting rules
        run: |
          python -m unittest discover -s tests -p 'test_nhl_competition.py' -v
          python -m unittest discover -s tests -p 'test_archive_safety.py' -v
      - name: Retry verified GS and ES reports on older NHL preseason games
        run: python recover_reports.py NHL stale
      - name: Preserve and classify international hockey events separately
        run: python competition_policy.py
      - name: Recalculate NHL pending reports excluding non-NHL competitions
        run: python adaptive_monitor.py heartbeat NHL
      - name: Block loss of any archived game or report link
        run: python tests/archive_integrity_gate.py archive.json
      - name: Publish classifications and verified reports only when changed
        run: |
          files="archive.json competition-review.json poll-status.json"
          if [[ -n "$(git status --porcelain $files)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add $files
            git diff --cached --check
            git commit -m "Classify non-NHL hockey and audit NHL preseason reports"
            for attempt in 1 2 3 4; do
              if git push; then exit 0; fi
              git pull --rebase -X theirs origin main
              python tests/archive_integrity_gate.py archive.json --baseline-ref FETCH_HEAD
              sleep 2
            done
            exit 1
          fi
          echo "No new NHL classification or verified report updates"
