name: Backfill NHL Historical Archive
on:
  workflow_dispatch:
  schedule:
    - cron: "8,23,38,53 * * * *"
permissions:
  contents: write
concurrency:
  group: nhl-gamebooks
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Retrieve historical official game records
        env:
          ARCHIVE_LEAGUE: nhl
        run: python backfill.py
      - name: Block any loss of previously archived games or report links
        run: python tests/archive_integrity_gate.py archive.json
      - name: Save historical archive and progress
        run: |
          if [[ -n "$(git status --porcelain archive.json archive-progress.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add archive.json archive-progress.json
            git commit -m "Backfill NHL historical archive"
            for attempt in 1 2 3 4; do
              if git push; then exit 0; fi
              git pull --rebase -X theirs origin main
              # Re-check against the freshly fetched remote after conflict resolution.
              python tests/archive_integrity_gate.py archive.json --baseline-ref FETCH_HEAD
              sleep 2
            done
            exit 1
          fi
