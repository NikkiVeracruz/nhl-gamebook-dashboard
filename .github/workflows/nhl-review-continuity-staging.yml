name: NHL preseason review continuation regression
on:
  push:
    branches: [staging-nhl-review-continuity-2026-11-23]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyyaml
      - name: Verify 2026 exception report and preserved historical records
        run: |
          python -m unittest discover -s tests -p 'test_nhl_competition.py' -v
          python -m unittest discover -s tests -p 'test_archive_safety.py' -v
          python - <<'PY'
          import yaml
          from pathlib import Path
          with Path(".github/workflows/stale-recovery-nhl.yml").open() as fp:
              assert "jobs" in yaml.safe_load(fp)
          PY
      - name: No archived data may be modified by tests
        run: git diff --exit-code -- archive.json gamebooks.json archive-progress.json
