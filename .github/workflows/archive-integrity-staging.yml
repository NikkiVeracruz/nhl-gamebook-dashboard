name: Archive integrity safety tests (staging)
on:
  push:
    branches:
      - staging-archive-safety-2026-11-22
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check Python syntax
        run: python -m py_compile archive.py tests/archive_integrity_gate.py
      - name: Simulate corrupt archives, duplicates, disk failure and actual repository merge
        run: python -m unittest discover -s tests -p 'test_archive_safety.py' -v
      - name: Verify archive publication gate rejects deletions and invalid documents
        run: python -m unittest discover -s tests -p 'test_archive_integrity_gate.py' -v
      - name: Inspect the currently checked-out historical archive without modifying it
        run: python tests/archive_integrity_gate.py archive.json
      - name: Confirm tracked gamebook and archive data were not modified
        run: git diff --exit-code -- archive.json gamebooks.json
