name: One-time forward-only archive cleanup (reversible via Git backup)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/forward-only-transition.yml
permissions:
  contents: write
concurrency:
  group: nhl-gamebooks
  cancel-in-progress: false
jobs:
  forward-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test forward-only complete-report policy and temp-archive isolation
        run: python -m unittest discover -s tests -p 'test_forward_only.py' -v
      - name: Enforce verified complete current/new game retention only
        run: python forward_only.py apply
      - name: Check that current feed and archive infrastructure remain unchanged
        run: |
          git diff --check
          git diff --exit-code -- gamebooks.json
          python -m py_compile archive.py forward_only.py
      - name: Publish scoped archive cleanup only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- archive.json
          if git diff --cached --quiet; then
            echo "Forward-only archived data already clean"
            exit 0
          fi
          git commit -m "Purge historical/incomplete archive records for forward-only collection"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then
              echo "Forward-only cleanup applied; original branch backup retained"
              exit 0
            fi
            git fetch origin main
            git rebase -X theirs origin/main
            python forward_only.py apply
            git add -- archive.json
            if ! git diff --cached --quiet; then
              git commit -m "Finish forward-only archive cleanup after concurrent update"
            fi
            sleep 2
          done
          echo "Cleanup not published due to concurrent writes" >&2
          exit 1
