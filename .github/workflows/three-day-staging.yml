name: Three-day NHL rolling feed safety rehearsal (staging)
on:
  push:
    branches: [staging-three-day-display-2026-11-23]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nhl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyyaml
      - name: Validate date rollover workflow and browser code
        run: |
          python -m py_compile three_day_window.py monitor.py archive.py
          python - <<'PY'
          import yaml
          with open(".github/workflows/three-day-rollover.yml") as fp:
            workflow=yaml.safe_load(fp)
          assert workflow.get("jobs")
          print("Rollover YAML is valid")
          PY
          python - <<'PY'
          import re
          from pathlib import Path
          source=Path("index.html").read_text()
          first=source.index("<script>")+len("<script>")
          last=source.index("</script>",first)
          script=source[first:last]
          assert "threeDisplayDates" in script and "lastWindowKey" in script
          Path("/tmp/three-day-nhl.js").write_text(script)
          PY
          node --check /tmp/three-day-nhl.js
      - name: Test 3 AM Eastern DST transitions and archive-before-removal
        run: |
          python -m unittest discover -s tests -p 'test_three_day_window.py' -v
          python -m unittest discover -s tests -p 'test_archive_safety.py' -v
      - name: Rehearse actual three-day schedule including all games (no publication)
        run: |
          python monitor.py
          python archive.py
          python tests/archive_integrity_gate.py archive.json
          python - <<'PY'
          import json
          from pathlib import Path
          from three_day_window import three_days
          expected=[d.isoformat() for d in three_days()]
          payload=json.loads(Path("gamebooks.json").read_text())
          assert len(expected)==3 and payload["window_dates"]==expected
          assert all(g["date"] in expected for g in payload["games"])
          ids=[str(g.get("id")) for g in payload["games"]]
          assert len(ids)==len(set(ids)), "Duplicate game ID"
          print("NHL: verified dates",expected,"and",len(ids),"games (no archive records lost)")
          PY
