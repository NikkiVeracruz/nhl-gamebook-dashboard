name: Rotate NHL three-day gamebook windows
# Independent of five-minute adaptive monitoring; runs even on game-free days.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/three-day-rollover.yml
  schedule:
    - cron: "2 3 * * *"
      timezone: "America/New_York"
permissions:
  contents: write
jobs:
  nhl:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    concurrency:
      group: nhl-gamebooks
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install existing NHL monitoring dependencies
        run: pip install -r requirements.txt
      - name: Verify exact three dates, DST and archive-before-removal protections
        run: python -m unittest discover -s tests -p 'test_three_day_window.py' -v
      - name: Refresh yesterday, today, and tomorrow (NHL, 3 AM Eastern)
        run: python monitor.py
      - name: Preserve outgoing NHL games in cumulative archive
        run: python archive.py
      - name: Reject loss of previously archived games and verified official reports
        run: python tests/archive_integrity_gate.py archive.json
      - name: Confirm published feed has exactly the proper three dates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from three_day_window import three_days
          path = "gamebooks.json"
          payload=json.loads(Path(path).read_text())
          expected=[d.isoformat() for d in three_days()]
          assert payload["window_dates"] == expected, (path, payload.get("window_dates"), expected)
          assert all(g["date"] in expected for g in payload["games"]), "Game outside rolling three days"
          assert len(expected) == 3 and len(set(expected)) == 3
          print("NHL: verified all games are within exactly three Eastern calendar dates", expected)
          PY
      - name: Publish rollover only if data changed
        run: |
          if [[ -n "$(git status --porcelain gamebooks.json archive.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add gamebooks.json archive.json
            git diff --cached --check
            git commit -m "Roll NHL current games at 3 AM Eastern"
            for attempt in 1 2 3 4; do
              if git push; then exit 0; fi
              git pull --rebase -X theirs origin main
              python tests/archive_integrity_gate.py archive.json --baseline-ref FETCH_HEAD
              sleep 2
            done
            echo "Unable to publish NHL rollover safely" >&2
            exit 1
          fi
          echo "NHL: current gamebook window already up to date"
