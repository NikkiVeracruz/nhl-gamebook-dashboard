name: Link retention failure simulations (staging)
on:
  push:
    branches:
      - staging-reliability
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install monitor dependencies
        run: python -m pip install requests
      - name: Simulate outage, discovery, and wrong-game matching
        run: python -m unittest discover -s tests -p 'test_link_simulations.py' -v
